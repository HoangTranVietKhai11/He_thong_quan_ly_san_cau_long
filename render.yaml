# Render Blueprint - Hệ thống Quản lý Sân Cầu Lông
# Docs: https://docs.render.com/blueprint-spec

databases:
  - name: badminton-db
    plan: free # Đổi thành "starter" hoặc "standard" nếu muốn DB lâu dài
    databaseName: badminton_booking_db
    user: badminton_user
    region: singapore # Gần Việt Nam nhất

services:
  # ========== BACKEND API ==========
  - type: web
    name: badminton-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./QLSCL_BACKEND/dockerfile
    dockerContext: ./QLSCL_BACKEND
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DB_HOST
        fromDatabase:
          name: badminton-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: badminton-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: badminton-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: badminton-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: badminton-db
          property: database
      - key: DATABASE_URL
        fromDatabase:
          name: badminton-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true # Render sẽ tự tạo một chuỗi bí mật ngẫu nhiên
      - key: ALLOWED_ORIGINS
        sync: false # Bạn sẽ điền URL frontend sau khi deploy xong

  # ========== FRONTEND (Vite Static Site) ==========
  - type: web
    name: badminton-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Bạn sẽ điền URL backend sau khi deploy xong (ví dụ: https://badminton-api.onrender.com/api)
